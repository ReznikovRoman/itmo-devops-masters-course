version: '3'
services:
  db:
    image: postgres:15
    container_name: postgres_data_marts
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: warehouse_db
    ports:
      - "5435:5432"
    volumes:
      - data_marts_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  data_marts_data:
