name: Delivery pipeline

on:
  push:
    paths:
      - 'delivery_pipeline/**'
  pull_request:
    paths:
      - 'delivery_pipeline/**'

defaults:
  run:
    working-directory: delivery_pipeline

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip  # кэш pip: ключ = хэш файла зависимостей
          cache-dependency-path: delivery_pipeline/requirements-dev.txt

      - name: Install dependencies
        run: make install

      - name: Run linter
        run: make lint

  test:
    # Тесты и сборка образа -- в pull request и после merge в основную ветку,
    # но не на каждый push в рабочую ветку.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: delivery_pipeline/requirements-dev.txt

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Save test report
        if: always()  # отчёт сохраняем и тогда, когда тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: delivery_pipeline/report.xml

  build-image:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: make build

  publish:
    # Публикуем только то, что прошло все проверки и попало в основную ветку.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          make build IMAGE="ghcr.io/${OWNER}/delivery-demo" TAG="${SHORT_SHA}" GIT_SHA="${GITHUB_SHA}"
          docker push "ghcr.io/${OWNER}/delivery-demo:${SHORT_SHA}"
